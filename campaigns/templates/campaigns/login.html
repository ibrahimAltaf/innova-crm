{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Innova CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'campaigns/css/app.css' %}?v=10">
  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top left, rgba(79, 70, 229, 0.12), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(14, 165, 233, 0.1), transparent 45%),
        var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="d-flex align-items-center gap-2 mb-4">
      <span class="brand-mark">IF</span>
      <div>
        <strong>Innova CRM</strong>
        <div class="small text-secondary">Sign in to your workspace</div>
      </div>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" autofocus required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="small text-secondary mt-3 mb-0">One team login. Create it with <code>python manage.py create_crm_user</code>.</p>
  </div>
</body>
</html>
